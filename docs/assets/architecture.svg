<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Appbridge architecture: AI client, gateway, safety, floor, Windows">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .box-accent { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.8; }
      .label { font: 600 15px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 12px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #475569; }
      .tiny { font: 11px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#head); }
      .note { font: 11px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #64748b; }
    </style>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#f8fafc"/>

  <!-- client -->
  <rect class="box" x="250" y="28" width="400" height="64"/>
  <text class="label" x="450" y="55" text-anchor="middle">AI client</text>
  <text class="sub" x="450" y="76" text-anchor="middle">Claude · Codex · Cursor · any MCP host · your own loop</text>

  <!-- transports -->
  <path class="arrow" d="M450,92 L450,130"/>
  <rect class="box" x="250" y="132" width="400" height="44" fill="#f1f5f9"/>
  <text class="sub" x="450" y="159" text-anchor="middle">MCP stdio · loopback REST + OpenAPI · CLI</text>

  <!-- gateway -->
  <path class="arrow" d="M450,176 L450,206"/>
  <rect class="box box-accent" x="200" y="208" width="500" height="86"/>
  <text class="label" x="450" y="236" text-anchor="middle">Gateway</text>
  <text class="sub" x="450" y="258" text-anchor="middle">42 tools · Scene formatting · action verification · dialog handling</text>
  <text class="tiny" x="450" y="278" text-anchor="middle">packages/gateway</text>

  <!-- safety -->
  <path class="arrow" d="M450,294 L450,322"/>
  <rect class="box" x="170" y="324" width="270" height="96" fill="#fef2f2" stroke="#ef4444"/>
  <text class="label" x="305" y="350" text-anchor="middle">Safety harness</text>
  <text class="sub" x="305" y="372" text-anchor="middle">effect classifier · firewall</text>
  <text class="sub" x="305" y="390" text-anchor="middle">approvals · kill switch</text>
  <text class="tiny" x="305" y="408" text-anchor="middle">packages/safety</text>

  <rect class="box" x="460" y="324" width="270" height="96" fill="#ecfdf5" stroke="#10b981"/>
  <text class="label" x="595" y="350" text-anchor="middle">Audit</text>
  <text class="sub" x="595" y="372" text-anchor="middle">hash-chained JSONL</text>
  <text class="sub" x="595" y="390" text-anchor="middle">append-only · locked</text>
  <text class="tiny" x="595" y="408" text-anchor="middle">packages/core</text>

  <!-- floor -->
  <path class="arrow" d="M305,420 L305,442 L450,442 L450,462"/>
  <path class="arrow" d="M595,420 L595,442 L450,442"/>
  <rect class="box box-accent" x="180" y="464" width="540" height="86"/>
  <text class="label" x="450" y="491" text-anchor="middle">Floor</text>
  <text class="sub" x="450" y="513" text-anchor="middle">Scene builder · stable ids · diff / stability · verification waits</text>
  <text class="tiny" x="450" y="533" text-anchor="middle">packages/floor</text>

  <!-- windows -->
  <path class="arrow" d="M450,550 L450,576"/>
  <rect class="box" x="150" y="578" width="600" height="44" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="sub" x="450" y="605" text-anchor="middle">Windows · UI Automation tree · SendInput · WinRT OCR · window manager</text>

  <!-- side: memory -->
  <rect class="box" x="20" y="208" width="150" height="212" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="label" x="95" y="236" text-anchor="middle">App memory</text>
  <text class="sub" x="95" y="260" text-anchor="middle">Playbooks</text>
  <text class="sub" x="95" y="280" text-anchor="middle">Skills</text>
  <text class="sub" x="95" y="300" text-anchor="middle">App Packs</text>
  <text class="sub" x="95" y="320" text-anchor="middle">Teach mode</text>
  <text class="tiny" x="95" y="348" text-anchor="middle">packages/memory</text>
  <text class="tiny" x="95" y="366" text-anchor="middle">~/.appbridge/memory</text>
  <path class="arrow" d="M170,314 L198,314"/>

  <!-- side: connect -->
  <rect class="box" x="730" y="208" width="150" height="212" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text class="label" x="805" y="236" text-anchor="middle">Connect Hub</text>
  <text class="sub" x="805" y="260" text-anchor="middle">client detection</text>
  <text class="sub" x="805" y="280" text-anchor="middle">config writers</text>
  <text class="sub" x="805" y="300" text-anchor="middle">backups + undo</text>
  <text class="tiny" x="805" y="348" text-anchor="middle">packages/connect</text>
  <path class="arrow" d="M730,314 L702,314"/>

  <text class="note" x="450" y="22" text-anchor="middle">Every path — MCP, REST, CLI — passes the same firewall and the same audit log.</text>
</svg>
