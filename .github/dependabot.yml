version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
          - "zod"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
