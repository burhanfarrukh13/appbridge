name: App Pack Request / Contribution
description: Request or propose a new declarative App Pack (automation skills/recipes for an application)
title: "[App Pack]: <Application Name>"
labels: ["app-pack", "skills", "community"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping grow the Appbridge App Pack ecosystem!
        App Packs contain declarative skills, playbooks, and dialog handling for specific desktop applications.
  - type: input
    id: app_name
    attributes:
      label: Target Application Name
      description: What desktop software would you like to automate?
      placeholder: e.g. Excel, Blender, Spotify, WhatsApp, LibreOffice, AutoCAD
    validations:
      required: true
  - type: textarea
    id: workflows
    attributes:
      label: Key Workflows / Actions Needed
      description: What specific tasks should an AI agent be able to execute inside this app?
      placeholder: |
        1. Open file and export as PDF
        2. Format column headers and calculate sum
        3. Search for item and click download
    validations:
      required: true
  - type: textarea
    id: additional_info
    attributes:
      label: Additional Context
      description: Is it Win32, WPF, Chromium/Electron, or Qt? Any accessibility notes or keyboard shortcuts?
