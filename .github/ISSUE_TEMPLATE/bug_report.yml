name: Bug report
description: Something behaves incorrectly, unreliably, or unsafely.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** include passwords, tokens, personal data
        or confidential screen contents. Security issues belong in a private advisory, not
        here (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you ask for, what did Appbridge do, and what did you expect?
      placeholder: |
        Asked the agent to ...
        The action returned ...
        I expected ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that still shows the problem.
      placeholder: |
        1. appbridge scene --window "..."
        2. appbridge call ui.click '{"uid":"e12"}'
        3. ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: ActionResult or Scene excerpt
      description: Paste the JSON result with values redacted.
      render: json
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: output of `appbridge version` or the commit hash
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (build 26100.xxxx)
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Interface
      options:
        - CLI
        - MCP (stdio)
        - REST gateway
        - Desktop console
        - Library / custom code
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and model (if applicable)
      placeholder: e.g. Claude Code with a mid-size model
  - type: textarea
    id: doctor
    attributes:
      label: appbridge doctor output
      description: Redact paths if needed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials and personal data from this report.
          required: true
        - label: This is not a security vulnerability (those go through a private advisory).
          required: true
        - label: I searched existing issues for the same behaviour.
          required: true
