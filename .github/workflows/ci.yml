name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: build · test · lint (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Universality Contract
        run: npm run lint:universality

      - name: CLI smoke test
        run: |
          node packages/cli/dist/index.js version
          node packages/cli/dist/index.js help

      - name: Package dry run
        run: npm pack --dry-run --workspace @appbridge/cli

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - name: Flutter dependencies
        working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile

      - name: Flutter tests
        working-directory: apps/desktop
        run: flutter test

      - name: Flutter analyze
        working-directory: apps/desktop
        run: flutter analyze

      - name: Build Windows desktop
        shell: pwsh
        run: |
          $version = (Get-Content ..\..\package.json -Raw | ConvertFrom-Json).version
          flutter build windows --release --build-name $version --build-number 1
        working-directory: apps/desktop

      - name: Portable ZIP smoke test
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          .\scripts\package-windows-release.ps1 -Version $version -OutputDirectory $env:RUNNER_TEMP
