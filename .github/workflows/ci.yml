name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: build · test · lint (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Universality Contract
        run: npm run lint:universality

      - name: CLI smoke test
        run: |
          node packages/cli/dist/index.js version
          node packages/cli/dist/index.js help

      - name: Package dry run
        run: npm pack --dry-run --workspace @appbridge/cli
